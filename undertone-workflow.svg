<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160"><rect width="1600" height="1160" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#216d71"/></marker></defs><text x="800" y="58" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="34" font-weight="700">UNDERTONE WORKFLOW ORCHESTRATION</text><rect x="50" y="100" width="430" height="120" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="265.0" y="141" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">01  Import TXT</text><text x="265.0" y="175" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Confirm participants and dates</text><text x="265.0" y="201" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Parse messages and source offsets</text><rect x="585" y="100" width="430" height="120" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="800.0" y="141" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">02  Store and version</text><text x="800.0" y="175" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Save original text and records</text><text x="800.0" y="201" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Update profile snapshot</text><rect x="1120" y="100" width="430" height="120" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="1335.0" y="141" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">03  Build profile</text><text x="1335.0" y="175" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Read batches; check source links</text><text x="1335.0" y="201" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Save checkpoints and review attributes</text><path d="M480 160 H570" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><path d="M1015 160 H1105" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><rect x="1120" y="295" width="430" height="110" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="1335.0" y="336" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Recovery</text><text x="1335.0" y="370" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Split an unfinished batch on output limit</text><text x="1335.0" y="396" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Reuse completed checkpoints</text><path d="M1335 220 V280" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><text x="1348" y="258" fill="#216d71" font-family="Arial, sans-serif" font-size="18" font-weight="700">if needed</text><rect x="50" y="500" width="430" height="120" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="265.0" y="541" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">04  Ask and validate</text><text x="265.0" y="575" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Check provider, people, files and dates</text><text x="265.0" y="601" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Load scoped room context</text><path d="M800 220 V460 H265 V485" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><rect x="585" y="500" width="430" height="120" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="800.0" y="541" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">05  Route input</text><text x="800.0" y="575" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Standalone greeting or farewell</text><text x="800.0" y="601" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Other inputs follow request-specific paths</text><path d="M480 560 H570" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><rect x="1120" y="500" width="430" height="120" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="1335.0" y="541" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Local response</text><text x="1335.0" y="575" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Greeting or farewell: no model call</text><text x="1335.0" y="601" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Obvious noise may prompt clarification</text><path d="M1015 560 H1105" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><text x="1030" y="542" fill="#216d71" font-family="Arial, sans-serif" font-size="18" font-weight="700">social</text><rect x="50" y="755" width="430" height="135" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="265.0" y="796" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Individual question</text><text x="265.0" y="830" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Full scoped history when it fits</text><text x="265.0" y="856" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">or cached extracts + selected originals</text><text x="265.0" y="882" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Generate and review when needed</text><rect x="585" y="755" width="430" height="135" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="800.0" y="796" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Across selected people</text><text x="800.0" y="830" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Gather scoped, source-linked evidence</text><text x="800.0" y="856" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Generate candidates and check items</text><text x="800.0" y="882" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Qualify unknown availability</text><rect x="1120" y="755" width="430" height="135" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="1335.0" y="796" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Other request paths</text><text x="1335.0" y="830" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Drafting or runAgent, depending on</text><text x="1335.0" y="856" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">mode, variant and independence</text><text x="1335.0" y="882" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Apply applicable limits and checks</text><path d="M800 620 V700 H265 V740" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><path d="M800 620 V740" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><path d="M800 620 V700 H1335 V740" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><rect x="435" y="1000" width="730" height="110" rx="10" fill="white" stroke="#a4b4bb" stroke-width="3"/><text x="800.0" y="1041" text-anchor="middle" fill="#1d344b" font-family="Arial, sans-serif" font-size="25" font-weight="700">06  Present results</text><text x="800.0" y="1075" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Show accepted findings, citations and limitations</text><text x="800.0" y="1101" text-anchor="middle" fill="#4d6070" font-family="Arial, sans-serif" font-size="19">Hosted models receive the content assembled for their calls</text><path d="M265 890 V950 H800 V985" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><path d="M800 890 V985" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/><path d="M1335 890 V950 H800 V985" fill="none" stroke="#216d71" stroke-width="4" marker-end="url(#arrow)"/></svg>